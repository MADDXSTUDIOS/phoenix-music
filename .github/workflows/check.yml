name: Check

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.2 (closest to CC's Lua)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2

      - name: Compiles
        run: luac5.2 -p phoenixmusic.lua

      - name: Not too many Lua locals (CC caps it at 200)
        run: python3 tools/localcheck.py phoenixmusic.lua

      - name: version.txt matches the app
        run: |
          app=$(grep -m1 -oP '^  version = "\K[0-9.]+' phoenixmusic.lua)
          file=$(head -n1 version.txt | tr -d '[:space:]v')
          echo "app $app, version.txt $file"
          test "$app" = "$file"

      - name: Smoke test (fake CC computer, random clicks and keys)
        run: lua5.2 tests/run_all.lua

  # When main has a new version that passed the checks, publish it as a
  # GitHub release (tag vX.Y.Z) with .github/release.md as the description.
  release:
    needs: lua
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish release if this version is new
        run: |
          ver=$(head -n1 version.txt | tr -d '[:space:]v')
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "v$ver already released"
          else
            gh release create "v$ver" --target "$GITHUB_SHA" -t "Phoenix Music $ver" -F .github/release.md
          fi

      - name: Tidy up the old test branch
        run: git push origin --delete ci-check || true
